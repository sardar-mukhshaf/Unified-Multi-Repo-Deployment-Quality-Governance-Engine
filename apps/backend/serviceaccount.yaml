# ------------------------------------------------------------------------------
# ServiceAccount — Backend API
# Bound to IRSA role for AWS API access (Secrets Manager, CloudWatch, etc.)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-api-sa
  namespace: default
  labels:
    app: backend-api
    app.kubernetes.io/name: backend-api-sa
    app.kubernetes.io/part-of: unified-saas
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/unified-saas-prod-backend-api-role
    eks.amazonaws.com/sts-regional-endpoints: "true"
