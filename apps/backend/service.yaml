apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: default
  labels:
    app: backend-api
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: unified-saas
spec:
  type: ClusterIP
  selector:
    app: backend-api
    version: stable
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
